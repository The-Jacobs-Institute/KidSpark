[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests/standalone", "backend/tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
